<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Collections Manager</title>
  <link rel="stylesheet" href="extension.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <img src="../icons/icon-32.svg" alt="Logo" class="header-logo">
        <h1>Tab Collections Manager</h1>
      </div>
      <div class="header-controls">
        <button id="showHiddenBtn" class="btn btn-secondary" title="Show all hidden collections" style="display: none;">
          Show Hidden
        </button>
        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle" id="viewOptionsDropdownBtn" title="View Options">
            View Options ▾
          </button>
          <div class="dropdown-menu" id="viewOptionsDropdownMenu">
            <button id="collapseAllBtn" class="dropdown-item" title="Collapse all collections">
              Collapse All
            </button>
            <button id="expandAllBtn" class="dropdown-item" title="Expand all collections">
              Expand All
            </button>
          </div>
        </div>
        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle" id="backupDropdownBtn" title="Backup and Restore Options">
            Backup ▾
          </button>
          <div class="dropdown-menu" id="backupDropdownMenu">
            <button id="importBtn" class="dropdown-item" title="Import backup from Panorama Tab Groups">
              Import Backup
            </button>
            <button id="exportBtn" class="dropdown-item" title="Export backup of tab collections">
              Export Backup
            </button>
          </div>
        </div>
        <input type="file" id="importInput" accept=".json" style="display: none;">
        <button id="groupUnassignedBtn" class="btn btn-secondary" title="Create collection from unassigned tabs">
          Group Unassigned
        </button>
        <button id="themeToggleBtn" class="btn btn-secondary theme-toggle-btn" title="Toggle Theme">
          <span id="themeToggleIcon"></span> <span id="themeToggleText"></span>
        </button>
        <button id="createBtn" class="btn btn-primary" title="Create new empty collection">
          + New Collection
        </button>
      </div>
    </header>

    <!-- Collections List -->
    <div id="collectionsContainer" class="collections-container">
      <div id="loadingMessage" class="loading-message">Loading collections...</div>
    </div>

    <!-- Status Messages -->
    <div id="statusMessage" class="status-message" style="display: none;"></div>
  </div>

  <script src="../shared/logger.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="../shared/tab-utils.js"></script>
  <script src="../shared/dom-utils.js"></script>
  <script src="../shared/event-utils.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="extension.js"></script>
  <script src="logic/collection-actions.js"></script>
  <script src="logic/backup-actions.js"></script>
  <script src="renderer.js"></script>
  <script src="ui-handlers.js"></script>
</body>
</html>
